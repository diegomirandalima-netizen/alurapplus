<!DOCTYPE html>                                         
<html lang="pt-br">                                     
<head>                                                  
    <meta charset="UTF-8">                             
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="style.css">            <!-- Conecta o arquivo CSS externo para aplicar os estilos visuais -->
    <title>Alura Plus</title>                           <!-- Define o texto que aparece na aba ou guia do navegador do usuario -->
</head>                                                 <!-- Fecha a secao de configuracoes do cabecalho -->
<body>                                                  <!-- Abre o corpo do documento onde fica toda a parte visivel do site -->
    <section class="principal container">               <!-- Cria uma secao estrutural principal usando as duas classes do CSS -->
        <div>                                           <!-- Cria um bloco de divisao para organizar o bloco de texto -->
            <h1>Com o Combo+, voce pode <p>
                aproveitar a Alura+ e o <P>
                Alura Lingua por um preco unico.</h1>
                <p> <!-- Cria o titulo principal da pagina -->
        </div>                                          <!-- Fecha o bloco de divisao do titulo principal -->
        
        <img src="Combo.png" alt="log promocional">    <!-- Insere a imagem promocional e define um texto alternativo de acessibilidade -->

        <div class="botoes-coluna">                     <!-- Cria um container flexivel para agrupar e empilhar os dois botoes -->
            <a href="https://alura.com.br" class="container__botao">Assine por 12x de R$ 120,00*</a> <!-- Cria o primeiro botao de link preenchido -->
            <a href="https://alura.com.br" class="container__botao2">assine somente o alura+</a> <!-- Cria o segundo botao de link transparente -->
        </div>                                          <!-- Fecha a caixa de agrupamento dos botoes -->
    </section>                                          <!-- Fecha a secao principal da pagina -->
</body>                                                 
</html>
