<!DOCTYPE html>                                         
<html lang="pt-br">                                     
<head>                                                  
    <meta charset="UTF-8">                             
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="style.css">            <!-- Conecta o arquivo CSS externo para aplicar os estilos visuais -->
    <title>Alura Plus</title>                           <!-- Define o texto que aparece na aba do navegador -->
</head>                                                 
<body>                                                  <!-- Abre o corpo visível do site -->
    <section class="principal container">               <!-- Seção estrutural principal -->
        <div>                                           <!-- Bloco de conteúdo do texto -->
            <h1 class="container__titulo">
                Com o Combo+, você pode aproveitar a<br>
                Alura+ e o Alura Língua por um preço<br>
                único.
            </h1>
        </div>                                          <!-- Fecha o bloco do título -->
        
        <img src="Combo.png" alt="logo promocional">    <!-- Insere a imagem promocional -->

        <div class="botoes-coluna">                     <!-- Container dos botões e avisos -->
            <a href="https://alura.com.br" class="container__botao">Assine por 12x de R$ 120,00*</a> 
            <a href="https://alura.com.br" class="container__botao2">Assine somente o Alura+</a> 
            <p class="container__aviso">*O preço pode variar caso a assinatura seja feita em outros planos.</p>
        </div>                                          <!-- Fecha a caixa de agrupamento dos botões -->
    </section>                                          <!-- Fecha a seção principal -->
</body>                                                 
</html>
